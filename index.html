<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">✻</span> Claude Code Quest</div>
    <div class="status">
      <div class="rank" id="rank"></div>
      <div class="xp">
        <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
        <span id="xp-text"></span>
      </div>
      <button class="ghost small" id="reset" title="Erase all progress">Reset</button>
    </div>
  </header>

  <div class="layout">
    <nav class="map" id="map" aria-label="Levels"></nav>
    <main class="stage" id="stage"></main>
  </div>

  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
